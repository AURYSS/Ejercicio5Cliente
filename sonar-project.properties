# Metadatos del Proyecto en SonarQube
sonar.projectKey=com.mx.cbtis:Ejercicio5Cliente
sonar.projectName=Ejercicio5Cliente
sonar.projectVersion=0.0.1-SNAPSHOT

# Rutas de Código Fuente y Binarios (Java 21)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8

# Integración con JaCoCo para Cobertura de Código (Coverage)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.inclusions=**/controller/VistaController.java
sonar.coverage.exclusions=**/Ejercicio5ClienteApplication.*,**/modelo/**,**/controller/GestorController.*
sonar.cpd.exclusions=**/*
